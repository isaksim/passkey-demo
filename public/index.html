<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passkey Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 400px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; text-align: center; color: #38bdf8; }
    p.subtitle { text-align: center; color: #64748b; font-size: 0.875rem; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: #94a3b8; }
    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }
    .btn-passkey { background: #0284c7; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-passkey:hover { background: #0369a1; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }
    .divider { text-align: center; color: #475569; font-size: 0.75rem; margin: 1rem 0; font-weight: bold; text-transform: uppercase; }
    #status {
      margin-top: 1.25rem;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }
    .status-info { background: #0369a122; color: #38bdf8; border: 1px solid #0284c744; }
    .status-success { background: #15803d22; color: #4ade80; border: 1px solid #22c55e44; }
    .status-error { background: #991b1b22; color: #f87171; border: 1px solid #ef444444; }
  </style>
  <script src="https://unpkg.com/@simplewebauthn/browser@9.0.1/dist/bundle/index.umd.min.js"></script>
</head>
<body>

  <div class="card">
    <h1>🔑 Passkey Authentication</h1>
    <p class="subtitle">FIDO2 / WebAuthn Standard</p>

    <!-- Passkey First / 1-Click Login -->
    <button class="btn btn-passkey" onclick="loginPasskey()">
      <span>Sign in with Passkey</span>
    </button>

    <div class="divider">or create new account</div>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" value="in4210" placeholder="Enter username..."  autocomplete="username webauthn">
    </div>

    <button class="btn btn-secondary" onclick="registerPasskey()">Register New Passkey</button>

    <div id="status"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
